<header class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">

    <div class="container-fluid">

        <a class="navbar-brand d-flex align-items-center" href="/">

            <img
                src="{{ url_for('static', filename='img/svxguardian-readme.png') }}"
                alt="{{ t('APP_NAME') }}"
                height="42"
                class="me-3">

            <div>

                <div class="fw-bold">
                    {{ t("APP_NAME") }}
                </div>

                <small class="text-secondary">
                    Monitor • Protect • Connect
                </small>

            </div>

        </a>

        <div class="d-flex align-items-center gap-3">

            <span class="text-light fw-semibold">
                {{ state.callsign if state.callsign else "NOCALL" }}
            </span>

            <a
                class="btn btn-outline-light btn-sm"
                href="{{ url_for('dashboard', lang='it') }}"
                title="Italiano">

                IT

            </a>

            <a
                class="btn btn-outline-light btn-sm"
                href="{{ url_for('dashboard', lang='en') }}"
                title="English">

                EN

            </a>

            <button
                class="btn btn-outline-light btn-sm"
                type="button"
                title="Theme">

                <i class="fa-solid fa-moon"></i>

            </button>

            <button
                class="btn btn-outline-light btn-sm"
                type="button"
                title="Settings">

                <i class="fa-solid fa-gear"></i>

            </button>

        </div>

    </div>

</header>
