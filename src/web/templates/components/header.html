<header class="svx-header">

    <div class="svx-header-inner">

        <!-- Logo -->
        <a
            class="svx-header-brand"
            href="{{ url_for('dashboard', lang=language) }}">

            <img
                src="{{ url_for(
                    'static',
                    filename='img/logos/logo-light.png'
                ) }}"
                alt="{{ t('APP_NAME') }}"
                class="svx-header-logo">

        </a>


        <!-- Controlli -->
        <div class="svx-header-controls">

            <span class="svx-header-callsign">
                {{ state.callsign if state.callsign else "NOCALL" }}
            </span>


            <!-- Commutatore vista standard / vista operativa -->

            {% if request.endpoint == "operational_monitor" %}

                <a
                    class="svx-header-button"
                    href="{{ url_for(
                        'dashboard',
                        lang=language
                    ) }}"
                    aria-label="Vista standard"
                    title="Vista standard">

                    <i class="fa-solid fa-table-columns"></i>

                </a>

            {% else %}

                <a
                    class="svx-header-button"
                    href="{{ url_for(
                        'operational_monitor',
                        lang=language
                    ) }}"
                    aria-label="Vista operativa"
                    title="Vista operativa">

                    <i class="fa-solid fa-display"></i>

                </a>

            {% endif %}


            <!-- Lingua -->
            <div class="dropdown svx-header-dropdown">

                <button
                    class="svx-header-button dropdown-toggle"
                    type="button"
                    id="languageDropdown"
                    data-bs-toggle="dropdown"
                    data-bs-auto-close="true"
                    aria-expanded="false"
                    aria-label="Language"
                    title="Language">

                    <i class="fa-solid fa-language"></i>

                    <span class="svx-header-language-name">
                        {{ languages[language]["native_name"] }}
                    </span>

                </button>

                <ul
                    class="dropdown-menu dropdown-menu-end svx-language-menu"
                    aria-labelledby="languageDropdown">

                    {% for language_code, metadata in languages.items() %}

                        <li>

                            <a
                                class="dropdown-item
                                {% if language_code == language %}
                                    active
                                {% endif %}"
                                href="{{ url_for(
                                    'dashboard',
                                    lang=language_code
                                ) }}">

                                <span class="svx-language-check">

                                    {% if language_code == language %}

                                        <i class="fa-solid fa-check"></i>

                                    {% endif %}

                                </span>

                                {{ metadata["native_name"] }}

                            </a>

                        </li>

                    {% endfor %}

                </ul>

            </div>


            <!-- Tema -->
            <button
                class="svx-header-button"
                type="button"
                id="themeToggle"
                aria-label="Theme"
                title="Theme">

                <i class="fa-solid fa-moon"></i>

            </button>


            <!-- Impostazioni -->
            <button
                class="svx-header-button"
                type="button"
                id="settingsButton"
                aria-label="Settings"
                title="Settings">

                <i class="fa-solid fa-gear"></i>

            </button>

        </div>

    </div>

</header>
