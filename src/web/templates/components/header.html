<header class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">

    <div class="container-fluid">

        <a
            class="navbar-brand d-flex align-items-center"
            href="{{ url_for('dashboard', lang=language) }}">

            <img
                src="{{ url_for('static', filename='img/svxguardian-readme.png') }}"
                alt="{{ t('APP_NAME') }}"
                height="42"
                class="me-3">

            <div>

                <div class="fw-bold">
                    {{ t("APP_NAME") }}
                </div>

                <small class="text-secondary">
                    Monitor • Protect • Connect
                </small>

            </div>

        </a>

        <div class="d-flex align-items-center gap-3">

            <span class="text-light fw-semibold">
                {{ state.callsign if state.callsign else "NOCALL" }}
            </span>

            <div class="dropdown">

                <button
                    class="btn btn-outline-light btn-sm dropdown-toggle"
                    type="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                    title="Language">

                    <i class="fa-solid fa-language me-1"></i>

                    {{ languages[language]["native_name"] }}

                </button>

                <ul class="dropdown-menu dropdown-menu-end">

                    {% for language_code, metadata in languages.items() %}

                        <li>

                            <a
                                class="dropdown-item {% if language_code == language %}active{% endif %}"
                                href="{{ url_for('dashboard', lang=language_code) }}">

                                {{ metadata["native_name"] }}

                            </a>

                        </li>

                    {% endfor %}

                </ul>

            </div>

            <button
                class="btn btn-outline-light btn-sm"
                type="button"
                title="Theme">

                <i class="fa-solid fa-moon"></i>

            </button>

            <button
                class="btn btn-outline-light btn-sm"
                type="button"
                title="Settings">

                <i class="fa-solid fa-gear"></i>

            </button>

        </div>

    </div>

</header>
