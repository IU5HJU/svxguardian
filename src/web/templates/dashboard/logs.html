{% extends "base.html" %}

{% block content %}

<div class="svx-dashboard-layout">

    {% include "components/sidebar.html" %}


    <section class="svx-dashboard-content">

        <div class="row">

            <div class="col-12">

                <div class="card">

                    <div
                        class="card-header
                        d-flex
                        justify-content-between
                        align-items-center
                        flex-wrap
                        gap-2"
                    >

                        <div>

                            <i class="fa-solid fa-list"></i>

                            <span>
                                {{ t("LOGS") }}
                            </span>

                        </div>


                        <div
                            class="d-flex
                            align-items-center
                            flex-wrap
                            gap-2"
                        >

                            <span
                                id="operational-log-counter"
                                class="badge bg-secondary"
                                title="Righe visualizzate"
                            >
                                0 / 500
                            </span>


                            <span
                                id="operational-log-status"
                                class="badge bg-success"
                            >
                                LIVE
                            </span>


                            <button
                                id="operational-log-autoscroll"
                                type="button"
                                class="btn btn-sm btn-outline-light"
                                title="Abilita o disabilita lo scorrimento automatico"
                            >
                                <i
                                    id="operational-log-autoscroll-icon"
                                    class="fa-solid fa-arrow-down"
                                ></i>

                                <span
                                    id="operational-log-autoscroll-text"
                                >
                                    Auto-scroll ON
                                </span>
                            </button>


                            <button
                                id="operational-log-clear"
                                type="button"
                                class="btn btn-sm btn-outline-light"
                                title="Svuota soltanto la visualizzazione"
                            >
                                <i class="fa-solid fa-eraser"></i>

                                <span>
                                    Clear
                                </span>
                            </button>


                            <button
                                id="operational-log-toggle"
                                type="button"
                                class="btn btn-sm btn-outline-light"
                            >
                                <i
                                    id="operational-log-toggle-icon"
                                    class="fa-solid fa-pause"
                                ></i>

                                <span
                                    id="operational-log-toggle-text"
                                >
                                    Pause
                                </span>
                            </button>

                        </div>

                    </div>


                    <div class="card-body">

                        <div
                            id="operational-log-error"
                            class="alert alert-danger d-none"
                        >
                            <i
                                class="fa-solid
                                fa-triangle-exclamation"
                            ></i>

                            <span>
                                Errore durante la lettura del log.
                            </span>
                        </div>


                        <div
                            class="d-flex
                            align-items-center
                            gap-2
                            small
                            text-muted
                            mb-3"
                        >
                            <i class="fa-regular fa-file-lines"></i>

                            <span>
                                /var/log/svxlink
                            </span>
                        </div>


                        <div
                            id="operational-log"
                            style="
                                height: 65vh;
                                min-height: 320px;
                                overflow-y: auto;
                                background: #111;
                                color: #e9ecef;
                                border-radius: 0.375rem;
                                padding: 1rem;
                                font-family:
                                    ui-monospace,
                                    SFMono-Regular,
                                    Menlo,
                                    Monaco,
                                    Consolas,
                                    'Liberation Mono',
                                    'Courier New',
                                    monospace;
                                font-size: 0.85rem;
                                line-height: 1.45;
                            "
                        >

                            <div
                                id="operational-log-empty"
                                class="text-muted"
                            >
                                In attesa degli eventi...
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

</div>


<script>

    const OPERATIONAL_LOG_MAX_LINES = 500;


    let operationalLogCursor = 0;

    let operationalLogPaused = false;

    let operationalLogAutoScroll = true;

    let operationalLogRequestRunning = false;


    const operationalLogElement =
        document.getElementById(
            "operational-log"
        );


    const operationalLogErrorElement =
        document.getElementById(
            "operational-log-error"
        );


    const operationalLogStatusElement =
        document.getElementById(
            "operational-log-status"
        );


    const operationalLogCounterElement =
        document.getElementById(
            "operational-log-counter"
        );


    const operationalLogToggleElement =
        document.getElementById(
            "operational-log-toggle"
        );


    const operationalLogToggleIconElement =
        document.getElementById(
            "operational-log-toggle-icon"
        );


    const operationalLogToggleTextElement =
        document.getElementById(
            "operational-log-toggle-text"
        );


    const operationalLogAutoScrollElement =
        document.getElementById(
            "operational-log-autoscroll"
        );


    const operationalLogAutoScrollIconElement =
        document.getElementById(
            "operational-log-autoscroll-icon"
        );


    const operationalLogAutoScrollTextElement =
        document.getElementById(
            "operational-log-autoscroll-text"
        );


    const operationalLogClearElement =
        document.getElementById(
            "operational-log-clear"
        );


    function getOperationalLogLines() {

        return operationalLogElement.querySelectorAll(
            "[data-log-id]"
        );

    }


    function updateOperationalLogCounter() {

        const lineCount =
            getOperationalLogLines().length;

        operationalLogCounterElement.textContent =
            String(lineCount)
            + " / "
            + String(
                OPERATIONAL_LOG_MAX_LINES
            );

    }


    function removeOperationalLogEmptyMessage() {

        const emptyElement =
            document.getElementById(
                "operational-log-empty"
            );


        if (
            emptyElement
            && emptyElement.parentNode
        ) {

            emptyElement.remove();

        }

    }


    function showOperationalLogEmptyMessage(
        message = "In attesa degli eventi..."
    ) {

        if (
            document.getElementById(
                "operational-log-empty"
            )
        ) {
            return;
        }


        const emptyElement =
            document.createElement(
                "div"
            );

        emptyElement.id =
            "operational-log-empty";

        emptyElement.className =
            "text-muted";

        emptyElement.textContent =
            message;


        operationalLogElement.appendChild(
            emptyElement
        );

    }


    function createOperationalLogLine(
        entry
    ) {

        const lineElement =
            document.createElement(
                "div"
            );

        lineElement.dataset.logId =
            String(
                entry.id
            );

        lineElement.textContent =
            entry.line;

        lineElement.style.whiteSpace =
            "pre-wrap";

        lineElement.style.overflowWrap =
            "anywhere";

        return lineElement;

    }


    function trimOperationalLog() {

        let lines =
            getOperationalLogLines();


        while (
            lines.length
            > OPERATIONAL_LOG_MAX_LINES
        ) {

            lines[0].remove();

            lines =
                getOperationalLogLines();

        }

    }


    function scrollOperationalLogToBottom() {

        operationalLogElement.scrollTop =
            operationalLogElement.scrollHeight;

    }


    function appendOperationalLogEntries(
        entries
    ) {

        if (
            !Array.isArray(entries)
            || entries.length === 0
        ) {
            return;
        }


        removeOperationalLogEmptyMessage();


        const fragment =
            document.createDocumentFragment();


        for (
            const entry
            of entries
        ) {

            fragment.appendChild(
                createOperationalLogLine(
                    entry
                )
            );

        }


        operationalLogElement.appendChild(
            fragment
        );


        trimOperationalLog();

        updateOperationalLogCounter();


        if (operationalLogAutoScroll) {

            scrollOperationalLogToBottom();

        }

    }


    function clearOperationalLogDisplay() {

        const lines =
            getOperationalLogLines();


        for (
            const line
            of lines
        ) {

            line.remove();

        }


        showOperationalLogEmptyMessage(
            "Visualizzazione svuotata. In attesa di nuovi eventi..."
        );

        updateOperationalLogCounter();

    }


    function setOperationalLogLiveState() {

        operationalLogStatusElement.className =
            "badge bg-success";

        operationalLogStatusElement.textContent =
            "LIVE";


        operationalLogToggleIconElement.className =
            "fa-solid fa-pause";

        operationalLogToggleTextElement.textContent =
            "Pause";

    }


    function setOperationalLogPausedState() {

        operationalLogStatusElement.className =
            "badge bg-warning text-dark";

        operationalLogStatusElement.textContent =
            "PAUSED";


        operationalLogToggleIconElement.className =
            "fa-solid fa-play";

        operationalLogToggleTextElement.textContent =
            "Play";

    }


    function setOperationalLogAutoScrollState() {

        if (operationalLogAutoScroll) {

            operationalLogAutoScrollIconElement.className =
                "fa-solid fa-arrow-down";

            operationalLogAutoScrollTextElement.textContent =
                "Auto-scroll ON";

            operationalLogAutoScrollElement.classList.remove(
                "btn-outline-warning"
            );

            operationalLogAutoScrollElement.classList.add(
                "btn-outline-light"
            );

            return;

        }


        operationalLogAutoScrollIconElement.className =
            "fa-solid fa-hand";

        operationalLogAutoScrollTextElement.textContent =
            "Auto-scroll OFF";

        operationalLogAutoScrollElement.classList.remove(
            "btn-outline-light"
        );

        operationalLogAutoScrollElement.classList.add(
            "btn-outline-warning"
        );

    }


    async function updateOperationalLog() {

        if (
            operationalLogPaused
            || operationalLogRequestRunning
        ) {
            return;
        }


        operationalLogRequestRunning = true;


        try {

            const response = await fetch(
                "{{ url_for('api_logs') }}"
                + "?after="
                + encodeURIComponent(
                    operationalLogCursor
                ),
                {
                    cache: "no-store"
                }
            );


            if (!response.ok) {

                operationalLogErrorElement.classList.remove(
                    "d-none"
                );

                return;

            }


            const data =
                await response.json();


            operationalLogErrorElement.classList.add(
                "d-none"
            );


            const entries =
                Array.isArray(
                    data.entries
                )
                    ? data.entries
                    : [];


            appendOperationalLogEntries(
                entries
            );


            /*
             * The cursor represents the last logfile event already
             * received by this browser.
             *
             * Pause prevents requests completely, so the cursor does
             * not advance while paused. Pressing Play therefore
             * retrieves the events accumulated during the pause.
             *
             * Clear intentionally does not change this cursor:
             * clearing the screen must not cause old logfile entries
             * to be downloaded again.
             */

            if (
                Number.isInteger(
                    data.latest_id
                )
                && data.latest_id
                    > operationalLogCursor
            ) {

                operationalLogCursor =
                    data.latest_id;

            }

        } catch (error) {

            operationalLogErrorElement.classList.remove(
                "d-none"
            );


            console.error(
                "SVX Guardian operational log update failed:",
                error
            );

        } finally {

            operationalLogRequestRunning = false;

        }

    }


    operationalLogToggleElement.addEventListener(
        "click",
        () => {

            operationalLogPaused =
                !operationalLogPaused;


            if (operationalLogPaused) {

                setOperationalLogPausedState();

                return;

            }


            setOperationalLogLiveState();


            /*
             * Immediately recover events accumulated while
             * the visual display was paused.
             */

            updateOperationalLog();

        }
    );


    operationalLogAutoScrollElement.addEventListener(
        "click",
        () => {

            operationalLogAutoScroll =
                !operationalLogAutoScroll;


            setOperationalLogAutoScrollState();


            if (operationalLogAutoScroll) {

                scrollOperationalLogToBottom();

            }

        }
    );


    operationalLogClearElement.addEventListener(
        "click",
        () => {

            clearOperationalLogDisplay();

        }
    );


    setOperationalLogLiveState();

    setOperationalLogAutoScrollState();

    updateOperationalLogCounter();

    updateOperationalLog();


    window.setInterval(
        updateOperationalLog,
        2000
    );

</script>

{% endblock %}
